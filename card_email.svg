<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 90" width="265" height="90">
  <defs>
    <style>
      @keyframes tw  { 0%,100%{opacity:.9} 50%{opacity:.2} }
      @keyframes tw2 { 0%,100%{opacity:.5} 50%{opacity:1}  }
      .s1{animation:tw  3.0s ease-in-out infinite}
      .s2{animation:tw2 4.8s ease-in-out infinite}
      .s3{animation:tw  2.5s ease-in-out infinite}
    </style>
    <filter id="frost" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ea4335" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="65%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ea4335" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c5221f" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <circle cx="228" cy="16" r="1.2" fill="#bfdbfe" class="s1"/>
  <circle cx="250" cy="52" r="1.0" fill="#93c5fd" class="s2"/>
  <circle cx="13"  cy="25" r="1.1" fill="#bfdbfe" class="s3"/>
  <circle cx="22"  cy="70" r="0.9" fill="#60a5fa" class="s2"/>

  <rect x="1" y="1" width="263" height="88" rx="18" fill="#1a0008" fill-opacity="0.75" filter="url(#frost)"/>
  <rect x="1" y="1" width="263" height="88" rx="18" fill="url(#glass)"/>
  <rect x="1" y="1" width="263" height="88" rx="18" fill="none" stroke="#ea4335" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="22" y="1.5" width="221" height="2" rx="1" fill="url(#shine)"/>

  <circle cx="48" cy="45" r="24" fill="url(#iconbg)"/>
  <circle cx="48" cy="45" r="24" fill="none" stroke="#ea4335" stroke-width="0.8" stroke-opacity="0.45"/>
  <!-- Envelope icon -->
  <rect x="33" y="35" width="30" height="20" rx="3" fill="none" stroke="#f0f9ff" stroke-width="1.5" stroke-opacity="0.9"/>
  <polyline points="33,36 48,48 63,36" fill="none" stroke="#f0f9ff" stroke-width="1.5" stroke-opacity="0.9" stroke-linejoin="round"/>

  <text x="88" y="37" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="#f28b82">EMAIL</text>
  <text x="88" y="54" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500" fill="#f0f9ff">tyra191712</text>
  <text x="88" y="70" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500" fill="#f0f9ff">@gmail.com</text>
</svg>
