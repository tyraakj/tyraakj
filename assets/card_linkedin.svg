<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 90" width="265" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
      .mono-text { font-family: 'Space Mono', monospace, 'Courier New'; }
      .sans-text { font-family: 'Segoe UI', -apple-system, sans-serif; }
    </style>
    <filter id="stamp-shadow-pink" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#stamp-shadow-pink)">
    <rect x="2" y="2" width="261" height="86" rx="10" fill="#fdfbf7" stroke="#cbd5e1" stroke-width="1" />
    <rect x="5" y="5" width="255" height="80" rx="8" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="4,3" />

    <g transform="translate(18, 17)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" />
      <text x="28" y="38" text-anchor="middle" class="sans-text" font-size="28" font-weight="800" fill="#ec4899">in</text>
    </g>

    <text x="88" y="34" class="mono-text" font-size="10" font-weight="700" fill="#ec4899" letter-spacing="2">LINKEDIN</text>
    <text x="88" y="54" class="sans-text" font-size="14" font-weight="600" fill="#0f172a">in/tyraakj</text>
    <text x="88" y="72" class="mono-text" font-size="10" font-weight="700" fill="#f43f5e">↗ connect</text>
