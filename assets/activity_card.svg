<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" width="320" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .mono-header { font-family: 'Space Mono', monospace, 'Courier New'; }
      .script-motto { font-family: 'Caveat', cursive, sans-serif; }
      .foot-text { font-family: 'Space Mono', monospace, 'Courier New'; }
      .stat-number { font-family: 'Space Mono', monospace, 'Courier New'; font-weight: 700; }
    </style>

    <filter id="memo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <filter id="pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <radialGradient id="pink-pin-radial" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>
  </defs>

  <g transform="translate(15, 20)" filter="url(#memo-shadow)">
    <rect x="0" y="0" width="290" height="315" rx="7" fill="#fcfbf7" stroke="#e2e8f0" stroke-width="1.2" />

    <text x="20" y="38" class="mono-header" font-size="11" font-weight="700" fill="#334155" letter-spacing="1">
      GITHUB ACTIVITY
    </text>
    <text x="270" y="38" text-anchor="end" class="mono-header" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
      YEAR-ROUND
    </text>

    <line x1="20" y1="48" x2="270" y2="48" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />

    <!-- JUST CONTRIBUTION COUNT HIGHLIGHT BOX -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="250" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
      <text x="125" y="23" text-anchor="middle" class="stat-number" font-size="20" fill="#2563eb">974+</text>
      <text x="125" y="36" text-anchor="middle" class="mono-header" font-size="8.5" font-weight="700" fill="#60a5fa" letter-spacing="1">CONTRIBUTIONS THIS YEAR</text>
    </g>

    <!-- CONTRIBUTION MATRIX (Balanced & Scaled for Room) -->
    <g transform="translate(22, 112)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="35" y="0" width="26" height="17" rx="3" fill="#bfdbfe" />
      <rect x="70" y="0" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="105" y="0" width="26" height="17" rx="3" fill="#93c5fd" />
      <rect x="140" y="0" width="26" height="17" rx="3" fill="#60a5fa" />
      <rect x="175" y="0" width="26" height="17" rx="3" fill="#bfdbfe" />
      <rect x="210" y="0" width="26" height="17" rx="3" fill="#93c5fd" />

      <!-- Row 2 -->
      <rect x="0" y="22" width="26" height="17" rx="3" fill="#bfdbfe" />
      <rect x="35" y="22" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="70" y="22" width="26" height="17" rx="3" fill="#2563eb" />
      <rect x="105" y="22" width="26" height="17" rx="3" fill="#bfdbfe" />
      <rect x="140" y="22" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="175" y="22" width="26" height="17" rx="3" fill="#fbcfe8" />
      <rect x="210" y="22" width="26" height="17" rx="3" fill="#e2e8f0" />

      <!-- Row 3 -->
      <rect x="0" y="44" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="35" y="44" width="26" height="17" rx="3" fill="#f472b6" />
      <rect x="70" y="44" width="26" height="17" rx="3" fill="#ec4899" />
      <rect x="105" y="44" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="140" y="44" width="26" height="17" rx="3" fill="#93c5fd" />
      <rect x="175" y="44" width="26" height="17" rx="3" fill="#2563eb" />
      <rect x="210" y="44" width="26" height="17" rx="3" fill="#60a5fa" />

      <!-- Row 4 -->
      <rect x="0" y="66" width="26" height="17" rx="3" fill="#93c5fd" />
      <rect x="35" y="66" width="26" height="17" rx="3" fill="#60a5fa" />
      <rect x="70" y="66" width="26" height="17" rx="3" fill="#e2e8f0" />
      <rect x="105" y="66" width="26" height="17" rx="3" fill="#f472b6" />
      <rect x="140" y="66" width="26" height="17" rx="3" fill="#ec4899" />
      <rect x="175" y="66" width="26" height="17" rx="3" fill="#2563eb" />
      <rect x="210" y="66" width="26" height="17" rx="3" fill="#bfdbfe" />
    </g>

    <!-- SEPARATOR LINE -->
    <line x1="20" y1="222" x2="270" y2="222" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3" />

    <!-- FOOTER LINK & SPARKLE -->
    <g transform="translate(20, 248)">
      <text x="0" y="0" class="foot-text" font-size="9.5" font-weight="400" fill="#64748b">
        Open GitHub for the live
      </text>
      <text x="0" y="15" class="foot-text" font-size="10" font-weight="700" fill="#2563eb">
        contribution graph ↗
      </text>
    </g>

    <g transform="translate(242, 248)">
      <polygon points="13,0 17,9 26,12 17,15 13,24 9,15 0,12 9,9" fill="#ec4899" opacity="0.85" />
      <polygon points="13,4 15,10 21,12 15,14 13,19 11,14 5,12 11,10" fill="#ffffff" />
      <polygon points="21,4 24,9 30,11 24,13 21,18 18,13 13,11 18,9" fill="#2563eb" opacity="0.75" />
    </g>
  </g>

  <!-- 3D Push-Pin -->
  <g transform="translate(160, 16)" filter="url(#pin-shadow)">
    <ellipse cx="0" cy="8" rx="6" ry="2.5" fill="#0f172a" opacity="0.3" />
    <circle cx="0" cy="0" r="11" fill="url(#pink-pin-radial)" />
    <ellipse cx="-3.5" cy="-4" rx="4" ry="2.5" fill="#ffffff" opacity="0.7" transform="rotate(-25, -3.5, -4)" />
  </g>
</svg>
