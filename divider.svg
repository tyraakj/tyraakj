<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="900" height="52">
  <defs>
    <style>
      @keyframes tw1 { 0%,100%{opacity:.9} 50%{opacity:.25} }
      @keyframes tw2 { 0%,100%{opacity:.5} 50%{opacity:1}   }
      @keyframes tw3 { 0%,100%{opacity:.7} 50%{opacity:.15} }
      @keyframes fl1 { 0%,100%{opacity:0} 40%,60%{opacity:.4}  }
      @keyframes fl2 { 0%,25%{opacity:0}  55%,70%{opacity:.3} 100%{opacity:0} }
      @keyframes fl3 { 0%,60%{opacity:0}  80%,90%{opacity:.3} 100%{opacity:0} }
      .s1{animation:tw1 3.1s ease-in-out infinite}
      .s2{animation:tw2 4.4s ease-in-out infinite}
      .s3{animation:tw3 2.7s ease-in-out infinite}
      .s4{animation:tw1 5.2s ease-in-out infinite}
      .s5{animation:tw2 3.7s ease-in-out infinite}
      .l1{animation:fl1 6.5s ease-in-out infinite}
      .l2{animation:fl2 8.0s ease-in-out infinite}
      .l3{animation:fl3 5.5s ease-in-out infinite}
      .l4{animation:fl1 7.0s ease-in-out infinite 1.5s}
      .l5{animation:fl2 9.0s ease-in-out infinite 2.0s}
    </style>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#60a5fa" stop-opacity="0.7"/>
      <stop offset="85%"  stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="26" x2="900" y2="26" stroke="url(#hg)" stroke-width="1"/>

  <!-- Left cluster -->
  <line x1="55"  y1="12" x2="95"  y2="28" stroke="#3b82f6" stroke-width=".8" class="l1"/>
  <line x1="95"  y1="28" x2="135" y2="14" stroke="#1d4ed8" stroke-width=".8" class="l2"/>
  <line x1="135" y1="14" x2="170" y2="32" stroke="#3b82f6" stroke-width=".8" class="l3"/>
  <line x1="55"  y1="12" x2="135" y2="14" stroke="#60a5fa" stroke-width=".6" class="l5"/>
  <circle cx="55"  cy="12" r="2.2" fill="#bfdbfe" class="s1"/>
  <circle cx="95"  cy="28" r="2.5" fill="#93c5fd" class="s2"/>
  <circle cx="135" cy="14" r="1.8" fill="#60a5fa" class="s3"/>
  <circle cx="170" cy="32" r="1.6" fill="#bfdbfe" class="s4"/>

  <!-- Left-mid faint stars -->
  <circle cx="250" cy="10" r="1.1" fill="#93c5fd" class="s5"/>
  <circle cx="290" cy="40" r="1.0" fill="#bfdbfe" class="s3"/>
  <circle cx="330" cy="18" r="1.3" fill="#60a5fa" class="s1"/>

  <!-- Center diamond -->
  <line x1="425" y1="10" x2="450" y2="26" stroke="#60a5fa" stroke-width=".9" class="l2"/>
  <line x1="450" y1="26" x2="475" y2="10" stroke="#3b82f6" stroke-width=".9" class="l2"/>
  <line x1="425" y1="42" x2="450" y2="26" stroke="#60a5fa" stroke-width=".9" class="l1"/>
  <line x1="450" y1="26" x2="475" y2="42" stroke="#3b82f6" stroke-width=".9" class="l1"/>
  <circle cx="425" cy="10" r="1.6" fill="#bfdbfe" class="s2"/>
  <circle cx="475" cy="10" r="1.6" fill="#93c5fd" class="s4"/>
  <circle cx="450" cy="26" r="3.0" fill="#3b82f6" class="s1"/>
  <circle cx="425" cy="42" r="1.6" fill="#60a5fa" class="s3"/>
  <circle cx="475" cy="42" r="1.6" fill="#bfdbfe" class="s5"/>

  <!-- Right-mid faint stars -->
  <circle cx="570" cy="38" r="1.0" fill="#93c5fd" class="s4"/>
  <circle cx="610" cy="14" r="1.3" fill="#bfdbfe" class="s2"/>
  <circle cx="650" cy="42" r="1.1" fill="#60a5fa" class="s3"/>

  <!-- Right cluster -->
  <line x1="730" y1="14" x2="765" y2="32" stroke="#3b82f6" stroke-width=".8" class="l3"/>
  <line x1="765" y1="32" x2="805" y2="12" stroke="#1d4ed8" stroke-width=".8" class="l4"/>
  <line x1="805" y1="12" x2="845" y2="30" stroke="#3b82f6" stroke-width=".8" class="l5"/>
  <line x1="730" y1="14" x2="805" y2="12" stroke="#60a5fa" stroke-width=".6" class="l1"/>
  <circle cx="730" cy="14" r="1.6" fill="#bfdbfe" class="s5"/>
  <circle cx="765" cy="32" r="2.5" fill="#93c5fd" class="s1"/>
  <circle cx="805" cy="12" r="2.0" fill="#60a5fa" class="s2"/>
  <circle cx="845" cy="30" r="2.2" fill="#bfdbfe" class="s4"/>
</svg>
