<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <style>
      @keyframes twinkle1 { 0%,100%{opacity:1;r:2} 50%{opacity:.3;r:1.2} }
      @keyframes twinkle2 { 0%,100%{opacity:.7;r:1.5} 50%{opacity:1;r:2.2} }
      @keyframes twinkle3 { 0%,100%{opacity:.5;r:1} 50%{opacity:.9;r:1.8} }
      @keyframes fadeLine  { 0%,100%{opacity:0} 40%,60%{opacity:.35} }
      @keyframes fadeLine2 { 0%,20%{opacity:0} 50%,70%{opacity:.25} 100%{opacity:0} }
      @keyframes fadeLine3 { 0%,60%{opacity:0} 80%,90%{opacity:.3} 100%{opacity:0} }
      @keyframes glowPulse { 0%,100%{filter:drop-shadow(0 0 6px #3b82f688)} 50%{filter:drop-shadow(0 0 18px #60a5facc)} }
      @keyframes slideUp   { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
      .star1{animation:twinkle1 3.2s ease-in-out infinite}
      .star2{animation:twinkle2 4.1s ease-in-out infinite}
      .star3{animation:twinkle3 2.7s ease-in-out infinite}
      .star4{animation:twinkle1 5.0s ease-in-out infinite}
      .star5{animation:twinkle2 3.8s ease-in-out infinite}
      .star6{animation:twinkle3 4.5s ease-in-out infinite}
      .line1{animation:fadeLine  6s ease-in-out infinite}
      .line2{animation:fadeLine2 8s ease-in-out infinite}
      .line3{animation:fadeLine3 5s ease-in-out infinite}
      .line4{animation:fadeLine  7s ease-in-out infinite 1.5s}
      .line5{animation:fadeLine2 9s ease-in-out infinite 2s}
      .title{animation:slideUp .8s ease-out forwards,glowPulse 4s ease-in-out 1s infinite;opacity:0}
      .sub  {animation:slideUp 1s ease-out .5s forwards;opacity:0}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000d1f"/>
      <stop offset="50%"  stop-color="#001333"/>
      <stop offset="100%" stop-color="#000d1f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Left cluster -->
  <line x1="60"  y1="30"  x2="130" y2="80"  stroke="#3b82f6" stroke-width=".8" class="line1"/>
  <line x1="130" y1="80"  x2="90"  y2="140" stroke="#3b82f6" stroke-width=".8" class="line2"/>
  <line x1="90"  y1="140" x2="40"  y2="110" stroke="#1d4ed8" stroke-width=".8" class="line3"/>
  <line x1="40"  y1="110" x2="60"  y2="30"  stroke="#1d4ed8" stroke-width=".8" class="line4"/>
  <line x1="130" y1="80"  x2="190" y2="50"  stroke="#3b82f6" stroke-width=".8" class="line5"/>
  <!-- Mid-left -->
  <line x1="190" y1="50"  x2="260" y2="100" stroke="#60a5fa" stroke-width=".8" class="line2"/>
  <line x1="260" y1="100" x2="220" y2="160" stroke="#3b82f6" stroke-width=".8" class="line1"/>
  <line x1="220" y1="160" x2="170" y2="130" stroke="#1d4ed8" stroke-width=".8" class="line3"/>
  <line x1="170" y1="130" x2="190" y2="50"  stroke="#3b82f6" stroke-width=".8" class="line5"/>
  <!-- Right cluster -->
  <line x1="720" y1="40"  x2="790" y2="90"  stroke="#3b82f6" stroke-width=".8" class="line3"/>
  <line x1="790" y1="90"  x2="760" y2="160" stroke="#60a5fa" stroke-width=".8" class="line1"/>
  <line x1="760" y1="160" x2="700" y2="130" stroke="#1d4ed8" stroke-width=".8" class="line4"/>
  <line x1="700" y1="130" x2="720" y2="40"  stroke="#3b82f6" stroke-width=".8" class="line2"/>
  <line x1="790" y1="90"  x2="850" y2="60"  stroke="#60a5fa" stroke-width=".8" class="line5"/>
  <line x1="850" y1="60"  x2="870" y2="130" stroke="#3b82f6" stroke-width=".8" class="line1"/>
  <line x1="870" y1="130" x2="760" y2="160" stroke="#1d4ed8" stroke-width=".8" class="line3"/>
  <!-- Far-right scattered -->
  <line x1="640" y1="25"  x2="720" y2="40"  stroke="#3b82f6" stroke-width=".6" class="line2"/>
  <line x1="640" y1="25"  x2="660" y2="90"  stroke="#1d4ed8" stroke-width=".6" class="line4"/>
  <line x1="660" y1="90"  x2="700" y2="130" stroke="#3b82f6" stroke-width=".6" class="line5"/>
  <!-- Far-left scattered -->
  <line x1="260" y1="100" x2="310" y2="60"  stroke="#3b82f6" stroke-width=".6" class="line4"/>
  <line x1="310" y1="60"  x2="350" y2="130" stroke="#1d4ed8" stroke-width=".6" class="line2"/>
  <line x1="350" y1="130" x2="260" y2="100" stroke="#3b82f6" stroke-width=".6" class="line3"/>

  <!-- Stars — left -->
  <circle cx="60"  cy="30"  r="2"   fill="#bfdbfe" class="star1"/>
  <circle cx="130" cy="80"  r="2.5" fill="#93c5fd" class="star2"/>
  <circle cx="90"  cy="140" r="1.8" fill="#60a5fa" class="star3"/>
  <circle cx="40"  cy="110" r="1.5" fill="#bfdbfe" class="star4"/>
  <circle cx="190" cy="50"  r="2"   fill="#93c5fd" class="star5"/>
  <!-- Stars — mid-left -->
  <circle cx="260" cy="100" r="2.2" fill="#bfdbfe" class="star6"/>
  <circle cx="220" cy="160" r="1.6" fill="#60a5fa" class="star1"/>
  <circle cx="170" cy="130" r="1.8" fill="#93c5fd" class="star2"/>
  <circle cx="310" cy="60"  r="1.5" fill="#bfdbfe" class="star3"/>
  <circle cx="350" cy="130" r="1.2" fill="#3b82f6" class="star4"/>
  <!-- Stars — mid scattered -->
  <circle cx="420" cy="20"  r="1.2" fill="#bfdbfe" class="star5"/>
  <circle cx="480" cy="175" r="1"   fill="#93c5fd" class="star6"/>
  <circle cx="390" cy="155" r="1.3" fill="#60a5fa" class="star1"/>
  <circle cx="510" cy="15"  r="1"   fill="#bfdbfe" class="star2"/>
  <!-- Stars — right cluster -->
  <circle cx="640" cy="25"  r="1.8" fill="#bfdbfe" class="star3"/>
  <circle cx="660" cy="90"  r="1.5" fill="#93c5fd" class="star4"/>
  <circle cx="720" cy="40"  r="2.2" fill="#60a5fa" class="star5"/>
  <circle cx="790" cy="90"  r="2.5" fill="#bfdbfe" class="star6"/>
  <circle cx="760" cy="160" r="1.8" fill="#93c5fd" class="star1"/>
  <circle cx="700" cy="130" r="2"   fill="#3b82f6" class="star2"/>
  <circle cx="850" cy="60"  r="1.6" fill="#bfdbfe" class="star3"/>
  <circle cx="870" cy="130" r="1.4" fill="#60a5fa" class="star4"/>
  <!-- Extra -->
  <circle cx="15"  cy="70"  r="1"   fill="#93c5fd" class="star5"/>
  <circle cx="560" cy="185" r="1"   fill="#bfdbfe" class="star6"/>
  <circle cx="885" cy="170" r="1.2" fill="#60a5fa" class="star1"/>

  <!-- Text -->
  <text x="450" y="95" text-anchor="middle"
    font-family="'Segoe UI',system-ui,sans-serif" font-size="38" font-weight="700" letter-spacing="3"
    fill="#f0f9ff" filter="url(#glow)" class="title">Tyra Kj</text>
  <text x="450" y="130" text-anchor="middle"
    font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="400" letter-spacing="5"
    fill="#60a5fa" class="sub">FULL STACK  ·  WEB3  ·  AI INFRASTRUCTURE</text>
</svg>
